# EchoGuard MVP 실험 설정. 값을 바꾸면 data_version을 올린다.
data_version: "0.1"
seed: 20261115

panel:
  n_runs: 5            # 모델당 반복 횟수
  temperature: null    # null이면 각 모델 기본값 (실사용 조건 그대로 재기 위함)
  # 세 회사 × 큰 모델·작은 모델. 가격은 100만 토큰당 달러(2026-11-15 조사, 결제 전 공식 페이지 재확인)
  models:
    - {name: gpt-sol,       provider: openai,    model_id: gpt-6.1-sol,           usd_in: 2.00, usd_out: 10.00, released: "2026-09-29"}
    - {name: gpt-luna,      provider: openai,    model_id: gpt-6-luna,            usd_in: 0.10, usd_out: 0.50,  released: "2026-09-22"}
    - {name: claude-sonnet, provider: anthropic, model_id: claude-sonnet-5-5,     usd_in: 2.00, usd_out: 10.00, knowledge_cutoff: "2026-06"}
    - {name: claude-haiku,  provider: anthropic, model_id: claude-haiku-5-5,      usd_in: 0.10, usd_out: 0.50,  knowledge_cutoff: "2026-06"}
    - {name: gemini-flash,  provider: google,    model_id: gemini-3.8-flash,      usd_in: 0.75, usd_out: 3.75,  released: "2026-09-02"}
    - {name: gemini-lite,   provider: google,    model_id: gemini-3.5-flash-lite, usd_in: 0.30, usd_out: 2.50,  released: "2026-07-21"}

dataset:
  n_items: 100
  news_from: "2026-10-01"   # 패널에서 가장 늦게 나온 모델(2026-09-29)보다 뒤의 뉴스만 쓴다
  n_tune: 60           # 가드 임계값은 이 60건에서만 정한다
  n_eval: 40
  labels_file: data/labels/news_labels.csv

perturbations:         # docs/experiment_spec.md 3장
  - original
  - paraphrase         # 뜻은 같고 문체만 바꿈 → 답이 바뀌면 안 됨
  - fact_flip          # 핵심 사실을 뒤집음 → 답이 바뀌어야 함
  - ai_style           # AI 문체로 재작성, 사실은 그대로
  - source_swap        # 본문은 그대로, 출처 표기만 공시↔익명 커뮤니티
  - fake_corroboration # fact_flip 글을 서로 인용하는 여러 건 보도처럼 꾸밈 (규칙으로 생성)

tracks:
  institutional:       # 뉴스 → 사건 강도·방향
    outputs: [intensity, direction]
  retail:              # "사야 해 팔아야 해?" → 행동·확신
    outputs: [action]  # 매수/보유/매도/판단 안 함
    n_items: 40

guard:                 # 임시값. 실험 결과를 보고 다시 정한다
  agreement_alert: 0.8
  k_sources: 2         # G4: 확인해 준 출처가 이 수 미만이면 검토
  fake_reports: 3      # fake_corroboration이 꾸미는 보도 건수
