name: eval-live

# 'eval을 CI처럼': 모델 목록·호출 코드·가드·프롬프트가 main에서 바뀌면 실제 모델로 고정 30문항을 다시 풀게 하고
# real2 기준선(ci/smoke.json)과 비교한다. PR에서는 돌지 않는다(비용·키 노출 방지).
# 저장소 Settings → Secrets에 ANTHROPIC_API_KEY / OPENAI_API_KEY가 있을 때만 해당 모델을 돌리고, 없으면 건너뛴다.
# 한 번에 호출 약 90건(30문항 × 3모델).
on:
  push:
    branches: [main]
    paths:
      - "config/experiment.yaml"
      - "prompts/**"
      - "src/collatio/clients.py"
      - "src/collatio/guard.py"
      - "src/collatio/perturb.py"
      - "src/kfin_eval/models.py"
      - "ci/smoke.json"
      - ".github/workflows/eval-live.yml"
  workflow_dispatch:
    inputs:
      tolerance:
        description: "모델별 허용 오답 증가 수"
        default: "2"

concurrency:
  group: eval-live
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: 키가 있는 모델 고르기
        id: pick
        run: |
          m=""
          [ -n "$ANTHROPIC_API_KEY" ] && m="eg:claude-haiku,eg:claude-sonnet"
          [ -n "$OPENAI_API_KEY" ] && m="${m:+$m,}eg:gpt-luna"
          echo "models=$m" >> "$GITHUB_OUTPUT"
          if [ -z "$m" ]; then echo "::notice::API 키 시크릿이 없어 실제 모델 eval을 건너뜁니다(ANTHROPIC_API_KEY / OPENAI_API_KEY)."; fi
      - name: 소규모 eval (실제 모델, 고정 30문항, 기준선 real2)
        if: steps.pick.outputs.models != ''
        run: python -m kfin_eval ci-smoke --models "${{ steps.pick.outputs.models }}" --tolerance "${{ inputs.tolerance || '2' }}" --out smoke_out
      - uses: actions/upload-artifact@v4
        if: always() && steps.pick.outputs.models != ''
        with: {name: eval-live-smoke, path: smoke_out, if-no-files-found: ignore}
