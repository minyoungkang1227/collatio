name: tests

# kfin-eval 자체 점검. Collatio·ShockLens를 옆 폴더에 받아 bridges.py가 실제 코드를 불러 쓰게 한다.
# API 키와 실제 모델 호출은 필요 없다(mock 모델만 쓴다).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: kfin-eval}
      - uses: actions/checkout@v4
        with: {repository: minyoungkang1227/collatio, path: collatio}
      - uses: actions/checkout@v4
        with: {repository: minyoungkang1227/shocklens, path: shocklens}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "collatio/requirements.txt"}
      - run: pip install numpy pandas scipy pyyaml -r collatio/requirements.txt
      - name: 전 과정 점검
        working-directory: kfin-eval
        run: python -m unittest discover -s tests
      - name: 정답지 점검
        working-directory: kfin-eval
        run: python -m kfin_eval ci-key
      - name: 소규모 eval 흐름 (mock)
        working-directory: kfin-eval
        run: python -m kfin_eval ci-smoke --models mock-perfect,mock-noisy
