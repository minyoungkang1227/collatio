name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      # 모의 모델과 지어낸 시험용 원문만 쓴다. API 키도 외부 접속도 필요 없다
      - run: pytest -q
      - run: PYTHONPATH=src python -m collatio.filter --mock
